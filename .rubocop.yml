AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'bundle/**/*'

Style/Documentation:
  Enabled: false

Layout/ParameterAlignment:
  Enabled: true

Style/Encoding:
  Enabled: false

Style/HashSyntax:
  Enabled: true

Layout/LineLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

# Windows CRLF line endings are acceptable in this repo
Layout/EndOfLine:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Layout/MultilineOperationIndentation:
  Enabled: false

Style/RedundantFreeze:
  Enabled: false
